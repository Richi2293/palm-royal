<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Palm Royal: explore the coastal city</title>
<meta name="description" content="Walk through a tropical Art Deco coastal city generated in Blender by AI-written Python scripts.">
<meta property="og:title" content="Palm Royal: explore the coastal city">
<meta property="og:description" content="A tropical Art Deco coastal city generated in Blender by AI-written Python scripts. Explore it in your browser.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a1018'/%3E%3Crect x='6' y='12' width='7' height='14' fill='%23ff3d7f'/%3E%3Crect x='16' y='6' width='7' height='20' fill='%232fe0bd'/%3E%3C/svg%3E">
<style>
  :root {
    --ink: #f2ece4;
    --muted: #9aa3ad;
    --panel: rgba(12, 18, 26, 0.82);
    --edge: rgba(242, 236, 228, 0.14);
    --neon: #ff3d7f;
    --aqua: #2fe0bd;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #0a1018; }
  body {
    font: 14px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  canvas { display: block; }

  .panel {
    position: fixed;
    background: var(--panel);
    border: 1px solid var(--edge);
    border-radius: 10px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }

  #title {
    top: 16px; left: 16px;
    padding: 12px 16px;
    max-width: min(360px, calc(100vw - 32px));
  }
  #title h1 {
    margin: 0;
    font-size: 15px;
    letter-spacing: .14em;
    text-transform: uppercase;
    font-weight: 600;
  }
  #title h1 span { color: var(--neon); }
  #title p { margin: 6px 0 0; color: var(--muted); font-size: 12.5px; }
  #title a { color: var(--aqua); text-decoration: none; }
  #title a:hover { text-decoration: underline; }

  #hud {
    bottom: 16px; left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px;
    max-width: calc(100vw - 32px);
  }
  button {
    font: inherit;
    font-size: 12.5px;
    color: var(--ink);
    background: rgba(242, 236, 228, .07);
    border: 1px solid var(--edge);
    border-radius: 7px;
    padding: 7px 13px;
    cursor: pointer;
    white-space: nowrap;
  }
  button:hover { background: rgba(242, 236, 228, .13); }
  button[aria-pressed="true"] {
    background: var(--aqua);
    border-color: var(--aqua);
    color: #05201b;
    font-weight: 600;
  }
  #hint { color: var(--muted); font-size: 12px; padding-right: 6px; }
  @media (max-width: 720px) { #hint { display: none; } }

  #loader {
    position: fixed;
    inset: 0;
    display: grid;
    place-content: center;
    justify-items: center;
    gap: 18px;
    background: #0a1018;
    text-align: center;
    padding: 24px;
    transition: opacity .6s ease;
  }
  #loader.done { opacity: 0; pointer-events: none; }
  #loader h2 {
    margin: 0;
    font-size: 13px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 500;
  }
  #bar { width: min(240px, 60vw); height: 2px; background: rgba(242, 236, 228, .15); overflow: hidden; }
  #bar i { display: block; height: 100%; width: 0%; background: var(--neon); transition: width .25s ease; }
  #loader small { color: var(--muted); font-size: 12px; max-width: 32ch; }

  #lock {
    position: fixed;
    inset: 0;
    display: none;
    place-content: center;
    justify-items: center;
    gap: 10px;
    background: rgba(6, 10, 16, .75);
    cursor: pointer;
    text-align: center;
    padding: 24px;
  }
  #lock.on { display: grid; }
  #lock strong { font-size: 16px; letter-spacing: .04em; }
  #lock span { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>

<div id="title" class="panel">
  <h1>Palm <span>Royal</span></h1>
  <p>A coastal city generated in Blender by AI-written Python scripts.
     <a href="https://github.com/Richi2293/palm-royal" target="_blank" rel="noopener">Source on GitHub</a></p>
</div>

<div id="hud" class="panel">
  <span id="hint">Drag to orbit, scroll to zoom</span>
  <button id="orbit" aria-pressed="true">Orbit</button>
  <button id="walk" aria-pressed="false">Walk</button>
  <button id="reset">Reset view</button>
</div>

<div id="lock">
  <strong>Click to walk</strong>
  <span>W A S D to move, mouse to look, Shift to run, Esc to exit</span>
</div>

<div id="loader">
  <h2>Loading the city</h2>
  <div id="bar"><i></i></div>
  <small id="status">3.7 MB of Draco-compressed geometry</small>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const EYE_HEIGHT = 1.7;
const WALK_SPEED = 9;
const RUN_MULTIPLIER = 2.6;

// Blender stores colours in linear space, so the values lifted from the scene
// are fed to three.js the same way rather than through an sRGB hex literal.
const linear = (r, g, b) => new THREE.Color().setRGB(r, g, b, THREE.LinearSRGBColorSpace);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
// The Blender scene renders through AgX, so the viewer uses the same transform.
renderer.toneMapping = THREE.AgXToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
// World background of coastal-city.blend: colour (0.085, 0.14, 0.24) at strength 0.5.
const sky = linear(0.085 * 0.5, 0.14 * 0.5, 0.24 * 0.5);
scene.background = sky;
scene.fog = new THREE.Fog(sky, 220, 700);

// The lights below mirror the ones in the Blender scene rather than inventing a
// look: a golden hour sun, a wide blue sky fill, and the warm boulevard lamps.
const fill = new THREE.HemisphereLight(linear(0.35, 0.55, 1.0), linear(0.16, 0.1, 0.06), 1.1);
scene.add(fill);

const sun = new THREE.DirectionalLight(linear(1.0, 0.69, 0.43), 2.6);
sun.position.set(-80, 120, 100); // Blender (-80, -100, 120), converted to Y-up.
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
// A large normalBias pushes shadow lookups into neighbouring geometry and
// drowns the whole city in self-shadow. Measured: 0.6 leaves the streets at
// a third of their unshadowed brightness, 0.05 keeps the cast shadows only.
sun.shadow.bias = -0.0005;
sun.shadow.normalBias = 0.05;
scene.add(sun);
scene.add(sun.target);

// The sixteen boulevard crossings, taken from the warm area lights that sit
// over them at z = 8 in Blender. They double as walk-mode spawn points: they
// are the only positions known to be on tarmac rather than inside a block.
const CROSSINGS = [];
for (const x of [-95, -35, 25, 75]) {
  for (const y of [-85, -25, 35, 95]) CROSSINGS.push([x, -y]);
}

const boulevard = new THREE.Group();
for (const [x, z] of CROSSINGS) {
  const lamp = new THREE.PointLight(linear(1.0, 0.48, 0.18), 260, 140, 2);
  lamp.position.set(x, 8, z);
  boulevard.add(lamp);
}
scene.add(boulevard);

const camera = new THREE.PerspectiveCamera(58, innerWidth / innerHeight, 0.5, 3000);

const orbit = new OrbitControls(camera, renderer.domElement);
orbit.enableDamping = true;
orbit.dampingFactor = 0.06;
orbit.maxPolarAngle = Math.PI * 0.495;
orbit.minDistance = 12;
orbit.maxDistance = 1200;

const walker = new PointerLockControls(camera, renderer.domElement);
scene.add(walker.object);

// Emissive windows and neon are what read as "dusk" in the Cycles renders, so
// the viewer gives them a restrained bloom rather than leaving them flat.
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
// The tower crowns are emissive at four times base strength, so the threshold
// sits above them: any lower and the rooftops burn out into white blobs.
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.26, 0.5, 1.15);
composer.addPass(bloom);
composer.addPass(new OutputPass());

let home = { position: new THREE.Vector3(), target: new THREE.Vector3() };
let city = null;
let ceilingY = 200;
let groundY = 0;

const down = new THREE.Vector3(0, -1, 0);
const probe = new THREE.Raycaster();
const probeOrigin = new THREE.Vector3();

/**
 * Height of the first surface under a point, so the walker stands on the
 * street or the pavement instead of sinking to the lowest point of the map,
 * which is the sea floor.
 */
function surfaceHeight(x, z, fallback) {
  if (!city) return fallback;
  probeOrigin.set(x, ceilingY, z);
  probe.set(probeOrigin, down);
  const hit = probe.intersectObject(city, true)[0];
  return hit ? hit.point.y : fallback;
}

/**
 * Collapse meshes that share geometry and material into instanced draws.
 * The city is built from linked duplicates, so this turns roughly twelve
 * thousand draw calls into a few hundred.
 */
function collapseToInstances(root) {
  root.updateMatrixWorld(true);
  const meshes = [];
  root.traverse((node) => { if (node.isMesh) meshes.push(node); });

  const groups = new Map();
  for (const mesh of meshes) {
    const material = Array.isArray(mesh.material)
      ? mesh.material.map((entry) => entry.uuid).join(',')
      : mesh.material.uuid;
    const key = `${mesh.geometry.uuid}|${material}`;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(mesh);
  }

  for (const mesh of meshes) {
    mesh.castShadow = true;
    mesh.receiveShadow = true;
  }

  const batched = new THREE.Group();
  let draws = 0;
  for (const group of groups.values()) {
    draws += 1;
    if (group.length < 2) continue;
    const instanced = new THREE.InstancedMesh(group[0].geometry, group[0].material, group.length);
    group.forEach((mesh, index) => instanced.setMatrixAt(index, mesh.matrixWorld));
    instanced.instanceMatrix.needsUpdate = true;
    // Instance-aware bounds keep raycasting against the ground cheap.
    instanced.computeBoundingBox();
    instanced.computeBoundingSphere();
    instanced.frustumCulled = false;
    instanced.castShadow = true;
    instanced.receiveShadow = true;
    batched.add(instanced);
    group.forEach((mesh) => mesh.removeFromParent());
  }
  root.add(batched);
  return draws;
}

/**
 * Bounds of the city itself. The ocean is a 500 x 460 metre plane around a
 * 280 x 250 metre island, so framing the whole scene would push the camera
 * almost twice as far back as it needs to be and centre it on open water.
 */
function cityBounds(root) {
  const box = new THREE.Box3();
  const scratch = new THREE.Box3();
  root.traverse((node) => {
    if (!node.isMesh) return;
    const material = Array.isArray(node.material) ? node.material[0] : node.material;
    if (material && /water|ocean/i.test(material.name)) return;
    box.union(scratch.setFromObject(node));
  });
  return box.isEmpty() ? new THREE.Box3().setFromObject(root) : box;
}

function frameScene(root) {
  const full = new THREE.Box3().setFromObject(root);
  const box = cityBounds(root);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  groundY = box.min.y;
  ceilingY = full.max.y + 10;
  city = root;

  const reach = Math.max(size.x, size.z);
  home.target.set(center.x, box.min.y + size.y * 0.25, center.z);
  home.position.set(center.x + reach * 0.5, box.min.y + reach * 0.42, center.z + reach * 0.66);

  scene.fog.near = reach * 0.7;
  scene.fog.far = reach * 3.2;
  camera.far = reach * 8;
  camera.updateProjectionMatrix();

  // Fit the shadow frustum to the city so the 4K map is not spent on the sea.
  const span = reach * 0.62;
  sun.position.set(center.x - span, box.max.y + span * 1.5, center.z + span * 1.25);
  sun.target.position.copy(center);
  sun.target.updateMatrixWorld();
  Object.assign(sun.shadow.camera, { left: -span, right: span, top: span, bottom: -span, near: 1, far: span * 6 });
  sun.shadow.camera.updateProjectionMatrix();

  resetView();
}

/**
 * Nearest boulevard crossing that is actually at street level. Dropping the
 * walker under the orbit target instead lands it on a rooftop whenever the
 * camera happens to be looking at a block.
 */
function spawnPoint() {
  const candidates = CROSSINGS
    .map(([x, z]) => ({ x, z, y: surfaceHeight(x, z, groundY) }))
    .filter((spot) => spot.y < groundY + 3);
  if (!candidates.length) return { x: orbit.target.x, z: orbit.target.z, y: groundY };
  candidates.sort((a, b) => (
    (a.x - orbit.target.x) ** 2 + (a.z - orbit.target.z) ** 2
    - ((b.x - orbit.target.x) ** 2 + (b.z - orbit.target.z) ** 2)
  ));
  return candidates[0];
}

function resetView() {
  camera.position.copy(home.position);
  orbit.target.copy(home.target);
  orbit.update();
}

const loader = new GLTFLoader();
const draco = new DRACOLoader();
draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/libs/draco/');
loader.setDRACOLoader(draco);

const overlay = document.getElementById('loader');
const progress = document.querySelector('#bar i');
const status = document.getElementById('status');

loader.load(
  'city.glb',
  (gltf) => {
    const draws = collapseToInstances(gltf.scene);
    scene.add(gltf.scene);
    frameScene(gltf.scene);
    status.textContent = `${draws} batches ready`;
    overlay.classList.add('done');
    animate();
  },
  (event) => {
    if (!event.lengthComputable) return;
    const percent = Math.round((event.loaded / event.total) * 100);
    progress.style.width = `${percent}%`;
    status.textContent = `${percent}% of 3.7 MB`;
  },
  () => {
    overlay.classList.remove('done');
    status.textContent = 'The city failed to load. Check the browser console.';
  },
);

let walkMode = false;

const orbitButton = document.getElementById('orbit');
const walkButton = document.getElementById('walk');
const lockPrompt = document.getElementById('lock');
const hint = document.getElementById('hint');

function setMode(mode) {
  const walking = mode === 'walk';
  walkMode = walking;
  orbitButton.setAttribute('aria-pressed', String(!walking));
  walkButton.setAttribute('aria-pressed', String(walking));
  orbit.enabled = !walking;
  lockPrompt.classList.toggle('on', walking && !walker.isLocked);
  hint.textContent = walking
    ? 'W A S D to move, Shift to run, Esc to exit'
    : 'Drag to orbit, scroll to zoom';

  if (walking) {
    const spot = spawnPoint();
    walker.object.position.set(spot.x, spot.y + EYE_HEIGHT, spot.z);
    // Face east along the boulevard, towards the beach, rather than into the
    // facade that happens to sit on the far side of the crossing.
    camera.rotation.set(0, -Math.PI / 2, 0);
  } else {
    walker.unlock();
    resetView();
  }
}

orbitButton.addEventListener('click', () => setMode('orbit'));
walkButton.addEventListener('click', () => setMode('walk'));
document.getElementById('reset').addEventListener('click', () => setMode('orbit'));
lockPrompt.addEventListener('click', () => walker.lock());
walker.addEventListener('lock', () => lockPrompt.classList.remove('on'));
walker.addEventListener('unlock', () => {
  if (walkButton.getAttribute('aria-pressed') === 'true') lockPrompt.classList.add('on');
});

const pressed = new Set();
addEventListener('keydown', (event) => pressed.add(event.code));
addEventListener('keyup', (event) => pressed.delete(event.code));
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  bloom.setSize(innerWidth, innerHeight);
});

// Handle for debugging and for the screenshot scripts that drive the viewer.
window.viewer = { THREE, scene, camera, renderer, composer, bloom, sun, fill, boulevard, orbit, walker, resetView };

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const delta = Math.min(clock.getDelta(), 0.1);

  // Orbit only drives the camera outside walk mode. Left running while the
  // walker waits for pointer lock, its maxPolarAngle clamp forbids sitting
  // below the orbit target and lifts the camera off the street.
  if (walkMode) {
    if (walker.isLocked) {
      const speed = WALK_SPEED * delta * (pressed.has('ShiftLeft') || pressed.has('ShiftRight') ? RUN_MULTIPLIER : 1);
      const forward = (pressed.has('KeyW') ? 1 : 0) - (pressed.has('KeyS') ? 1 : 0);
      const strafe = (pressed.has('KeyD') ? 1 : 0) - (pressed.has('KeyA') ? 1 : 0);
      if (forward) walker.moveForward(forward * speed);
      if (strafe) walker.moveRight(strafe * speed);
      if (forward || strafe) {
        // The walker follows the surface below it. There is no collision
        // solving, so walls and buildings can be walked through.
        const { x, y, z } = walker.object.position;
        const target = surfaceHeight(x, z, groundY) + EYE_HEIGHT;
        walker.object.position.y = y + (target - y) * Math.min(1, delta * 8);
      }
    }
  } else {
    orbit.update();
  }

  composer.render();
}
</script>
</body>
</html>
